  <style>
    /* splash: painted before any script runs */
    /* v5.0: no spinner — the logo slowly breathes (fades out and back) while the app loads,
       then everything fades away gently into the app */
    #splash { position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 30px; background: #F6F5F1; transition: opacity 1.4s cubic-bezier(.45,0,.25,1); }
    html.dark #splash { background: #0A0F18; }
    #splash.out { opacity: 0; pointer-events: none; }
    #splash.out .sp-mark { transform: scale(1.05); opacity: 0; transition: transform 1.4s cubic-bezier(.22,1,.36,1), opacity 1.1s cubic-bezier(.45,0,.25,1); }
    #splash .sp-mark { display: flex; flex-direction: column; align-items: center; gap: 30px; }
    #splash .sp-logo { width: 84px; height: 84px; border-radius: 20px; box-shadow: 0 18px 40px -16px rgba(17,27,44,.45); animation: spIn 1s cubic-bezier(.22,1,.36,1) both, spPulse 2.8s ease-in-out 1s infinite; }
    #splash .sp-name { margin-top: -14px; font: 700 15px/1 Cinzel, "Times New Roman", serif; letter-spacing: .32em; color: #86683A; opacity: 0; animation: spFade 1s ease .4s forwards; }
    html.dark #splash .sp-name { color: #DDBE85; }
    @keyframes spIn { from { opacity: 0; transform: scale(.94); } to { opacity: 1; transform: none; } }
    @keyframes spPulse { 0%, 100% { opacity: 1; } 50% { opacity: .38; } }
    @keyframes spFade { from { opacity: 0; } to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { #splash .sp-logo { animation: spFade .4s ease both; } }
  </style>

  <script>
    // v5.4.1: still on the logo after 12 s → say where it stopped and offer a way out
    // ("ล้างแคช" only clears the app files the browser keeps — never your data)
    setTimeout(function () {
      var sp = document.getElementById('splash');
      if (!sp || sp.classList.contains('out') || !window.__kairosBooted) return;
      var dk = document.documentElement.classList.contains('dark');
      var box = document.createElement('div');
      box.style.cssText = 'max-width:320px;margin:4px 24px 0;text-align:center;font:14px/1.55 -apple-system,system-ui,sans-serif;color:' + (dk ? '#ABB2BF' : '#4E5868');
      box.innerHTML = '<div style="font-weight:600;color:' + (dk ? '#EEEAE1' : '#111B2C') + ';margin-bottom:4px">เปิดนานกว่าปกติ</div>' +
        '<div>ถ้ามีแท็บหรือแอพ Kairos/Kairos เปิดค้างไว้ ลองปิดก่อนแล้วกดลองใหม่</div>' +
        '<div style="font-size:12px;color:#8C93A0;margin-top:6px">ขั้น: ' + (window.__bootStage || '-') + (window.__bootErr ? ' · ' + String(window.__bootErr).replace(/[<>&]/g, '').slice(0, 140) : '') + ' · ' + (window.KAIROS_VERSION || '') + '</div>' +
        '<div style="display:flex;gap:8px;justify-content:center;margin-top:12px">' +
        '<button id="sp-retry" style="font:inherit;padding:8px 14px;border-radius:10px;border:0;background:#111B2C;color:#fff">ลองใหม่</button>' +
        '<button id="sp-clear" style="font:inherit;padding:8px 14px;border-radius:10px;border:0;background:#E7E4DC;color:#111B2C">ล้างแคชแล้วเปิดใหม่</button></div>';
      sp.appendChild(box);
      document.getElementById('sp-retry').onclick = function () { location.reload(); };
      document.getElementById('sp-clear').onclick = function () {
        var jobs = [];
        try { if (navigator.serviceWorker) jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); })); } catch (e) {}
        try { if (window.caches) jobs.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); })); } catch (e) {}
        Promise.all(jobs).then(function () { location.reload(); }, function () { location.reload(); });
      };
    }, 12000);
    // If the app has not started after 8 s, explain what is wrong instead of a blank page.
    setTimeout(function () {
      if (window.__kairosBooted) return;
      var r = document.getElementById('root');
      if (!r || r.childElementCount) return;
      var sp = document.getElementById('splash'); if (sp) sp.remove();
      r.innerHTML = '<div style="max-width:440px;margin:18vh auto;padding:24px;font:15px/1.6 -apple-system,system-ui,sans-serif;color:#111B2C">' +
        '<b style="font-size:18px">เปิด Kairos ไม่สำเร็จ</b><br>ไฟล์บางไฟล์อาจอัปโหลดไม่ครบ ให้ตรวจว่าใน repository มีไฟล์ต่อไปนี้อยู่ระดับเดียวกับ index.html:<br>' +
        '<code>app.js, app.css, config.js, sw.js</code> และไฟล์ <code>*.js</code> อื่นทุกไฟล์จากโฟลเดอร์ kairos-app<br><br>' +
        '<button onclick="location.reload(true)" style="font:inherit;padding:8px 16px;border-radius:10px;border:0;background:#111B2C;color:#fff">ลองโหลดใหม่</button></div>';
    }, 8000);
  </script>
